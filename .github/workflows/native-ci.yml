name: Native Desktop CI

on:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native-ci.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-ci.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.compiler }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            compiler: clang
          - os: ubuntu-24.04
            compiler: gcc
          - os: windows-latest
            compiler: msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpulse-dev libx11-dev libxext-dev \
                                  libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev \
                                  libxinerama-dev libgl1-mesa-dev libvulkan-dev

      - name: Setup macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install sdl3 cmake

      - name: Configure CMake
        run: |
          cmake -B native/build -S native \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Targets
        run: |
          cmake --build native/build --config Release -j

      - name: Run Unit Tests
        run: |
          ctest --test-dir native/build -C Release --output-on-failure

